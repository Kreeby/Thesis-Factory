[project]
name = "thesis-factory"
version = "0.1.0"
description = "Auditable AI-assisted research and software-engineering system for producing a master's thesis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
